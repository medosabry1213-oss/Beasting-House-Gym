<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BEASTING HOUSE GYM</title>
    <style>
        :root { --primary: #ffcc00; --bg: #000; --card: #111; --text: #fff; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; direction: rtl; }
        
        /* واجهة الدخول (تختفي بعد التسجيل) */
        #auth-screen { height: 100vh; display: flex; align-items: center; justify-content: center; background: radial-gradient(#222, #000); }
        .auth-card { background: var(--card); padding: 30px; border-radius: 25px; border: 1px solid var(--primary); width: 85%; text-align: center; }
        .auth-input { width: 100%; padding: 15px; margin: 10px 0; border-radius: 12px; border: 1px solid #333; background: #222; color: #fff; box-sizing: border-box; }
        
        /* واجهة تسجيل التمارين */
        header { background: #111; padding: 20px; text-align: center; border-bottom: 2px solid var(--primary); }
        .container { padding: 20px; padding-bottom: 120px; }
        .exercise-card { background: var(--card); border-radius: 20px; padding: 20px; margin-bottom: 20px; border-right: 5px solid var(--primary); }
        .ex-title-input { width: 100%; background: #222; border: 1px solid #444; color: var(--primary); padding: 12px; border-radius: 10px; font-weight: bold; margin-bottom: 15px; text-align: center; }
        
        .set-row { display: flex; gap: 10px; margin-bottom: 10px; }
        .set-row input { flex: 1; background: #222; border: 1px solid #444; color: #fff; padding: 12px; border-radius: 10px; text-align: center; }
        
        /* السجل والـ Popup */
        .history-item { background: #151515; padding: 15px; border-radius: 15px; margin-bottom: 10px; border: 1px solid #333; cursor: pointer; display: flex; justify-content: space-between; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1000; padding: 20px; box-sizing: border-box; }
        .modal-content { background: var(--card); border-radius: 20px; padding: 25px; border: 1px solid var(--primary); max-width: 500px; margin: auto; }

        .btn-main { background: var(--primary); color: #000; border: none; width: 100%; padding: 18px; border-radius: 15px; font-weight: bold; font-size: 16px; cursor: pointer; }
        .footer { position: fixed; bottom: 0; left: 0; width: 100%; background: #000; padding: 15px; box-sizing: border-box; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="auth-screen">
        <div class="auth-card">
            <h1 style="color:var(--primary); margin:0;">BEASTING</h1>
            <p style="color:#555; margin-bottom:20px;">HOUSE GYM</p>
            <input type="text" id="reg-name" class="auth-input" placeholder="اسمك">
            <input type="tel" id="reg-phone" class="auth-input" placeholder="رقم الموبايل">
            <input type="password" id="reg-pass" class="auth-input" placeholder="كلمة السر">
            <button class="btn-main" onclick="handleAuth()">دخول الأبطال</button>
        </div>
    </div>

    <div id="app-screen" class="hidden">
        <header><h1 style="color:var(--primary); margin:0;">BEASTING HOUSE</h1></header>
        <div class="container">
            <h2 style="font-size:18px;">جلسة تمرين جديدة</h2>
            <div id="active-workout"></div>
            <button onclick="addExercise()" style="width:100%; background:#222; border:1px dashed #444; color:#888; padding:12px; border-radius:12px; margin-top:10px;">+ إضافة تمرين جديد</button>

            <h2 style="margin-top:40px; color:var(--primary)">السجلات السابقة</h2>
            <div id="history-list"></div>
        </div>
        <div class="footer">
            <button class="btn-main" onclick="saveWorkout()">حفظ التمرين النهائى</button>
        </div>
    </div>

    <div id="details-modal" class="modal">
        <div class="modal-content">
            <h3 id="modal-date" style="color:var(--primary)"></h3>
            <div id="modal-body" style="max-height: 300px; overflow-y: auto;"></div>
            <button class="btn-main" onclick="closeModal()" style="margin-top:20px;">إغلاق</button>
        </div>
    </div>

    <script>
        let user = null;

        // فحص الدخول التلقائي
        window.onload = function() {
            const saved = localStorage.getItem("session");
            if (saved) { user = JSON.parse(saved); showApp(); }
        }

        function handleAuth() {
            const name = document.getElementById('reg-name').value;
            const phone = document.getElementById('reg-phone').value;
            const pass = document.getElementById('reg-pass').value;

            if(!phone || !pass) return alert("اكمل بياناتك يا وحش");

            const existing = JSON.parse(localStorage.getItem("user_" + phone));
            if(existing && existing.pass !== pass) return alert("كلمة السر غلط!");

            user = existing || { name, phone, pass };
            localStorage.setItem("user_" + phone, JSON.stringify(user));
            localStorage.setItem("session", JSON.stringify(user));
            showApp();
        }

        function showApp() {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('app-screen').classList.remove('hidden');
            loadHistory();
            if(document.getElementById('active-workout').children.length === 0) addExercise();
        }

        function addExercise() {
            const id = Date.now();
            const html = `
                <div class="exercise-card" id="ex-${id}">
                    <input type="text" class="ex-title-input" placeholder="اسم التمرين...">
                    <div id="sets-${id}"></div>
                    <button onclick="addSet('${id}')" style="background:none; border:none; color:var(--primary); font-size:12px; margin-top:10px;">+ مجموعة</button>
                </div>`;
            document.getElementById('active-workout').insertAdjacentHTML('beforeend', html);
            addSet(id);
        }

        function addSet(id) {
            const html = `<div class="set-row"><input type="number" class="w-val" placeholder="وزن"><input type="number" class="r-val" placeholder="عدات"></div>`;
            document.getElementById(`sets-${id}`).insertAdjacentHTML('beforeend', html);
        }

        function saveWorkout() {
            const cards = document.querySelectorAll('.exercise-card');
            const sessionDetails = [];
            cards.forEach(card => {
                const name = card.querySelector('.ex-title-input').value || "تمرين";
                const sets = [];
                card.querySelectorAll('.set-row').forEach(row => {
                    sets.push({ w: row.querySelector('.w-val').value || 0, r: row.querySelector('.r-val').value || 0 });
                });
                sessionDetails.push({ name, sets });
            });

            const history = JSON.parse(localStorage.getItem("history_" + user.phone)) || [];
            history.unshift({ date: new Date().toLocaleString('ar-EG'), details: sessionDetails });
            localStorage.setItem("history_" + user.phone, JSON.stringify(history));

            alert("عاش يا بطل! تم الحفظ.");
            document.getElementById('active-workout').innerHTML = "";
            addExercise();
            loadHistory();
        }

        function loadHistory() {
            const history = JSON.parse(localStorage.getItem("history_" + user.phone)) || [];
            document.getElementById('history-list').innerHTML = history.map((item, index) => `
                <div class="history-item" onclick="showDetails(${index})">
                    <span>${item.date}</span>
                    <span style="color:var(--primary)">عرض التفاصيل ></span>
                </div>`).join('');
        }

        function showDetails(index) {
            const history = JSON.parse(localStorage.getItem("history_" + user.phone));
            const item = history[index];
            document.getElementById('modal-date').innerText = item.date;
            document.getElementById('modal-body').innerHTML = item.details.map(ex => `
                <div style="border-bottom:1px solid #333; padding:10px 0;">
                    <strong style="color:var(--primary)">${ex.name}</strong><br>
                    ${ex.sets.map((s, i) => `<small>م${i+1}: ${s.w} كجم × ${s.r} عدات</small>`).join('<br>')}
                </div>`).join('');
            document.getElementById('details-modal').style.display = 'block';
        }

        function closeModal() { document.getElementById('details-modal').style.display = 'none'; }
    </script>
</body>
</html>
