<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BEASTING HOUSE GYM | PRO</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

    <style>
        :root { --primary: #ffcc00; --bg: #050505; --card: #121212; --text: #fff; --danger: #ff4444; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding-bottom: 150px; }
        header { background: #000; padding: 20px; text-align: center; border-bottom: 3px solid var(--primary); position: sticky; top: 0; z-index: 100; display: flex; justify-content: center; align-items: center; }
        .gym-name { font-size: 26px; font-weight: 900; color: var(--primary); margin: 0; cursor: pointer; }
        .logout-btn { position: absolute; left: 20px; font-size: 24px; cursor: pointer; color: var(--primary); background: rgba(255,255,255,0.1); padding: 5px 10px; border-radius: 10px; }
        .auth-container { height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; }
        .auth-card { background: var(--card); padding: 30px; border-radius: 30px; border: 1px solid var(--primary); width: 100%; max-width: 400px; text-align: center; }
        input, textarea, select { width: 100%; padding: 12px; margin: 5px 0; border-radius: 10px; border: 1px solid #333; background: #1e1e1e; color: #fff; box-sizing: border-box; outline: none; }
        .exercise-box { background: var(--card); margin: 15px; padding: 15px; border-radius: 20px; border-right: 6px solid var(--primary); position: relative; }
        .set-row { display: grid; grid-template-columns: 1fr 1fr 40px; gap: 8px; margin-top: 8px; align-items: center; }
        .del-btn { color: var(--danger); border: 1px solid var(--danger); border-radius: 8px; text-align: center; cursor: pointer; padding: 5px; font-size: 12px; }
        .btn { width: 100%; padding: 15px; border-radius: 15px; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-set { background: rgba(255, 204, 0, 0.1); color: var(--primary); border: 1px solid var(--primary); font-size: 13px; padding: 8px; }
        .btn-save { background: var(--primary); color: #000; font-size: 18px; font-weight: 900; position: fixed; bottom: 70px; width: 92%; left: 4%; z-index: 1000; box-shadow: 0 5px 20px rgba(0,0,0,0.5); }
        .history-card { background: #1a1a1a; margin: 10px 15px; padding: 15px; border-radius: 15px; border: 1px solid #333; position: relative; }
        .details-box { background: #000; padding: 10px; border-radius: 10px; margin-top: 10px; display: none; font-size: 13px; border: 1px solid #222; }
        footer { position: fixed; bottom: 0; width: 100%; text-align: center; background: #000; padding: 15px 0; border-top: 1px solid #222; font-size: 12px; z-index: 999; }
        .hidden { display: none !important; }
        .net-status { font-size: 10px; padding: 2px 8px; border-radius: 10px; float: left; margin-top: 5px; }
        .level-badge { background: var(--primary); color: #000; padding: 2px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        .coach-plan-btn { background: linear-gradient(45deg, #ffcc00, #ff8800); color: #000; padding: 15px; margin: 15px; border-radius: 15px; text-align: center; font-weight: bold; cursor: pointer; box-shadow: 0 4px 15px rgba(255,204,0,0.3); }
        .admin-user-card { background: #1a1a1a; padding: 15px; margin: 10px; border-radius: 15px; border: 1px solid #333; border-right: 5px solid var(--primary); position: relative; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 2000; padding: 20px; box-sizing: border-box; overflow-y: auto; }
        .status-locked { border-right-color: var(--danger) !important; opacity: 0.7; }
        .delete-user-btn { position: absolute; top: 10px; left: 10px; color: var(--danger); font-size: 18px; cursor: pointer; background: rgba(255,68,68,0.1); width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .search-container { padding: 10px 15px; background: #000; border-bottom: 1px solid #222; position: sticky; top: 70px; z-index: 99; }
        #adminSearch { border: 1px solid var(--primary); background: #111; padding: 12px; border-radius: 12px; font-size: 16px; }
    </style>
</head>
<body>

    <div id="auth-screen" class="auth-container">
        <div class="auth-card">
            <h1 onclick="checkAdmin()" style="color:var(--primary); cursor:pointer;">BEASTING HOUSE GYM</h1>
            <input type="text" id="reg-name" placeholder="الاسم بالكامل">
            <input type="tel" id="reg-phone" placeholder="رقم التليفون">
            <input type="password" id="reg-pass" placeholder="كلمة السر">
            <button class="btn" style="background:var(--primary)" onclick="handleAuth()">دخول الوحوش ⚡</button>
        </div>
    </div>

    <div id="admin-panel" class="hidden">
        <header><div class="logout-btn" onclick="location.reload()">🔙</div><p class="gym-name">لوحة تحكم الكابتن محمود</p></header>
        <div class="search-container">
            <input type="text" id="adminSearch" placeholder="ابحث بالاسم أو برقم التليفون..." oninput="filterUsers()">
        </div>
        <div id="admin-users-list" style="padding:15px;"></div>
    </div>

    <div id="app-screen" class="hidden">
        <header><div class="logout-btn" onclick="logout()">🔙</div><p class="gym-name">BEASTING HOUSE GYM</p></header>
        <div id="user-welcome" style="padding:20px; background: linear-gradient(to bottom, #111, #050505); border-bottom: 1px solid #222;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <div style="font-size: 14px; color: #888;">عاش يا وحش 🔥</div>
                    <div id="display-name" style="font-size: 24px; font-weight: 900; color: var(--primary); margin-top: 5px;"></div>
                </div>
                <div id="display-level" class="level-badge">مستوى: مبتدئ</div>
            </div>
            <span id="online-indicator" class="net-status" style="background:#444; margin-top: 10px;">مزامنة...</span>
        </div>
        
        <div class="coach-plan-btn" id="plan-btn" onclick="toggleCoachSection()">📋 نظام تمرينك يا وحش (اضغط هنا)</div>
        <div id="coach-section" class="hidden">
            <h3 style="margin: 10px 20px; color:#2ecc71;">الخطة المحددة لك:</h3>
            <div id="coach-exercises"></div>
        </div>
        
        <div id="exercises-list"></div>
        <button class="btn" style="background:none; border:2px dashed #444; color:#fff; width:92%; margin:15px 4%;" onclick="addExercise()">+ إضافة تمرينة أخرى</button>
        <div style="padding: 15px;"><h3 style="border-right: 4px solid var(--primary); padding-right: 10px; margin-bottom: 20px;">سجل بطولاتك الشخصية 🏆</h3><div id="history-container"></div></div>
        
        <button class="btn btn-save" onclick="saveWorkout()">حفظ التمرين ✅</button>
        <footer><div style="color:var(--primary); font-weight: bold;">المطور: محمد صبري</div><div style="color: #666;">01097281524</div></footer>
    </div>

    <div id="admin-user-history" class="modal"><h2 id="viewing-user-name" style="color:var(--primary)"></h2><div id="user-history-content"></div><button class="btn" style="background:var(--primary)" onclick="document.getElementById('admin-user-history').style.display='none'">إغلاق</button></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC-rY8xvvnuWJ6e0YkrS6DteOYKr_0VwYI",
            authDomain: "beastinggym.firebaseapp.com",
            projectId: "beastinggym",
            storageBucket: "beastinggym.firebasestorage.app",
            messagingSenderId: "431004173980",
            appId: "1:431004173980:web:344626f3ab38d98ebb0f59",
            measurementId: "G-TEQEWZ03B1",
            databaseURL: "https://beastinggym-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        db.goOnline();

        let currentUser = null;
        let allUsersData = {};

        function logout() { localStorage.removeItem("gym_beast_user"); location.reload(); }
        function checkAdmin() { if(prompt("كلمة السر الخاصة بك:") === "00550088") { document.getElementById('auth-screen').classList.add('hidden'); document.getElementById('admin-panel').classList.remove('hidden'); loadAllUsers(); } }

        function loadAllUsers() {
            db.ref('users').on('value', (snap) => {
                allUsersData = snap.val() || {};
                renderUserList(allUsersData);
            });
        }

        function renderUserList(users) {
            const list = document.getElementById('admin-users-list');
            list.innerHTML = "";
            for(let phone in users) {
                const u = users[phone].profile || {};
                const level = u.level || "مبتدئ";
                const isLocked = u.status === "locked";
                list.innerHTML += `
                    <div class="admin-user-card ${isLocked ? 'status-locked' : ''}" data-name="${u.name}" data-phone="${phone}">
                        <div class="delete-user-btn" onclick="deleteUser('${phone}', '${u.name}')">🗑</div>
                        <div style="display:flex; justify-content:space-between; margin-left: 30px;">
                            <b>${u.name || 'مجهول'}</b>
                            <span style="color:var(--primary)">${phone}</span>
                        </div>
                        <div style="background:#000; padding:5px; margin:5px 0; border-radius:5px; font-size:12px;">
                            <span style="color:#888">كلمة السر: </span> <span style="color:#fff">${u.pass || '---'}</span>
                        </div>
                        <select onchange="updateLevel('${phone}', this.value)">
                            <option value="مبتدئ" ${level=='مبتدئ'?'selected':''}>مبتدئ</option>
                            <option value="متوسط" ${level=='متوسط'?'selected':''}>متوسط</option>
                            <option value="وحش كاسر" ${level=='وحش كاسر'?'selected':''}>وحش كاسر</option>
                        </select>
                        <div id="admin-inputs-${phone}"><input type="text" class="plan-input" placeholder="اسم تمرينة"></div>
                        <button class="btn btn-set" style="margin-top:5px;" onclick="addAdminInput('${phone}')">+ خانة تمرين</button>
                        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                            <button class="btn" style="background:var(--primary); color:#000;" onclick="assignPlan('${phone}')">تحديث</button>
                            <button class="btn" style="background:#222; color:#fff;" onclick="viewUserHistory('${phone}', '${u.name}')">التمارين</button>
                        </div>
                        <button class="btn" style="background:${isLocked ? '#2ecc71' : 'var(--danger)'}; color:#fff;" onclick="toggleLock('${phone}', '${isLocked ? 'active' : 'locked'}')">
                            ${isLocked ? 'تفعيل' : 'إيقاف الاشتراك'}
                        </button>
                    </div>`;
            }
        }

        function filterUsers() {
            const val = document.getElementById('adminSearch').value.toLowerCase();
            const cards = document.querySelectorAll('.admin-user-card');
            cards.forEach(card => {
                const name = card.getAttribute('data-name').toLowerCase();
                const phone = card.getAttribute('data-phone').toLowerCase();
                card.style.display = (name.includes(val) || phone.includes(val)) ? 'block' : 'none';
            });
        }

        function deleteUser(p, n) { if(confirm(`حذف البطل ${n}؟`)) { db.ref('users/' + p).remove(); } }
        function toggleLock(p, status) { db.ref('users/' + p + '/profile/status').set(status); }
        function addAdminInput(p) { document.getElementById(`admin-inputs-${p}`).insertAdjacentHTML('beforeend', '<input type="text" class="plan-input" placeholder="اسم تمرينة">'); }
        function updateLevel(p, v) { db.ref('users/' + p + '/profile/level').set(v); }
        function assignPlan(p) { 
            const inputs = document.querySelectorAll(`#admin-inputs-${p} .plan-input`);
            const plan = [];
            inputs.forEach(inp => { if(inp.value.trim() !== "") plan.push(inp.value.trim()); });
            db.ref('users/' + p + '/dailyPlan').set(plan).then(() => alert("تم الإرسال!")); 
        }

        function handleAuth() {
            const n = document.getElementById('reg-name').value, p = document.getElementById('reg-phone').value, ps = document.getElementById('reg-pass').value;
            if(!p || !ps) return alert("البيانات ناقصة!");
            db.ref('users/' + p).once('value', (snap) => {
                const d = snap.val();
                if(d && d.profile && d.profile.pass !== ps) return alert("كلمة السر خطأ!");
                if(d && d.profile && d.profile.status === "locked") return alert("حسابك مغلق، راجع الكابتن محمود.");
                currentUser = d ? d.profile : { name: n, phone: p, pass: ps, level: "مبتدئ", status: "active" };
                if(!d) db.ref('users/' + p + '/profile').set(currentUser);
                localStorage.setItem("gym_beast_user", JSON.stringify(currentUser));
                startApp();
            });
        }

        function startApp() {
            if (!currentUser) return;
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('app-screen').classList.remove('hidden');
            document.getElementById('display-name').innerText = currentUser.name || "يا وحش";
            db.ref('users/' + currentUser.phone + '/profile/level').on('value', s => { if(s.val()) document.getElementById('display-level').innerText = "مستوى: " + s.val(); });
            updateNetStatus(); loadCoachPlan(); addExercise(); loadHistory();
        }

        function toggleCoachSection() { document.getElementById('coach-section').classList.toggle('hidden'); }

        function loadCoachPlan() {
            db.ref('users/' + currentUser.phone + '/dailyPlan').on('value', (snap) => {
                const plan = snap.val(), container = document.getElementById('coach-exercises');
                if(plan) {
                    container.innerHTML = "";
                    plan.forEach((ex, i) => {
                        const id = 'coach-' + i + '-' + Date.now();
                        container.innerHTML += `<div class="exercise-box" style="border-right-color:#2ecc71"><b class="ex-name-label" style="color:#2ecc71">${ex}</b><div id="sets-${id}"></div><button class="btn btn-set" onclick="addSetRow('${id}')">+ مجموعة</button></div>`;
                        setTimeout(() => addSetRow(id), 100);
                    });
                }
            });
        }

        function addExercise() {
            const id = Date.now();
            document.getElementById('exercises-list').insertAdjacentHTML('beforeend', `<div class="exercise-box" id="ex-${id}"><input type="text" class="ex-name-input" placeholder="اسم التمرين"><div id="sets-${id}"></div><button class="btn btn-set" onclick="addSetRow('${id}')">+ مجموعة</button></div>`);
            addSetRow(id);
        }

        function addSetRow(id) {
            const sid = Math.random().toString(36).substr(2, 9);
            document.getElementById(`sets-${id}`).insertAdjacentHTML('beforeend', `<div class="set-row" id="set-${sid}"><input type="number" class="w-val" placeholder="وزن"><input type="number" class="r-val" placeholder="عدات"><div class="del-btn" onclick="this.parentElement.remove()">X</div></div>`);
        }

        function saveWorkout() {
            const exers = [];
            document.querySelectorAll('.exercise-box').forEach(box => {
                const inp = box.querySelector('.ex-name-input'), label = box.querySelector('.ex-name-label');
                const name = inp ? inp.value : (label ? label.innerText : "");
                const sets = [];
                box.querySelectorAll('.set-row').forEach(row => { 
                    const w = row.querySelector('.w-val').value, r = row.querySelector('.r-val').value; 
                    if(w || r) sets.push({ w: w || 0, r: r || 0 }); 
                });
                if(name && sets.length > 0) exers.push({ name, sets });
            });
            if(exers.length === 0) return alert("سجل تمرينة!");
            db.ref('users/' + currentUser.phone + '/history/' + Date.now()).set({ id: Date.now().toString(), date: new Date().toLocaleString('ar-EG'), data: exers }).then(() => { alert("تم الحفظ! 🔥"); location.reload(); });
        }

        function loadHistory() {
            db.ref('users/' + currentUser.phone + '/history').on('value', (snap) => {
                const data = snap.val(), container = document.getElementById('history-container');
                container.innerHTML = ""; if(!data) return;
                Object.values(data).reverse().forEach(item => {
                    let details = item.data.map(ex => `<div style="margin-bottom:5px;"><b style="color:var(--primary)">${ex.name}</b>: ${ex.sets.map(s => s.w + "كجم x " + s.r).join(' | ')}</div>`).join('');
                    container.insertAdjacentHTML('beforeend', `<div class="history-card" onclick="toggleDet('${item.id}')"><b>${item.date}</b><div class="details-box" id="det-${item.id}">${details}</div></div>`);
                });
            });
        }

        function toggleDet(id) { const el = document.getElementById('det-' + id); if(el) el.style.display = (el.style.display === 'block') ? 'none' : 'block'; }
        
        function updateNetStatus() { 
            const ind = document.getElementById('online-indicator'); 
            if(navigator.onLine) { ind.innerText = "متصل ✅"; ind.style.background = "#2ecc71"; } 
            else { ind.innerText = "أوفلاين (سيتم الرفع لاحقاً) ⚠️"; ind.style.background = "#e74c3c"; } 
        }

        function viewUserHistory(p, n) { 
            db.ref('users/' + p + '/history').once('value', s => { 
                let h = s.val(), c = document.getElementById('user-history-content'); 
                c.innerHTML = ""; 
                document.getElementById('viewing-user-name').innerText = n;
                if(!h) c.innerHTML = "لا يوجد بيانات"; 
                else Object.values(h).reverse().forEach(w => { 
                    let detailHtml = w.data.map(e => `<div style="background:#000; padding:8px; margin-top:5px; border-radius:8px; border-right:2px solid var(--primary)"><b style="color:var(--primary)">${e.name}</b><br>${e.sets.map((s, idx) => `<small>م${idx+1}: ${s.w}كجم x ${s.r}</small>`).join(' | ')}</div>`).join('');
                    c.innerHTML += `<div class="history-card"><b>📅 ${w.date}</b>${detailHtml}</div>`; 
                }); 
                document.getElementById('admin-user-history').style.display = 'block'; 
            }); 
        }

        window.onload = () => { 
            const saved = localStorage.getItem("gym_beast_user"); 
            if(saved) { currentUser = JSON.parse(saved); startApp(); } 
            window.addEventListener('online', updateNetStatus);
            window.addEventListener('offline', updateNetStatus);
        };
    </script>
</body>
    </html>
